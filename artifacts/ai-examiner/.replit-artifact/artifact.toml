kind = "web"
previewPath = "/"
title = "AI Examiner"
description = "An AI-assisted exam evaluation workspace where educators upload answer-sheet PDFs, provide an answer key or rubric, and receive structured scores, per-question feedback, and grading insights from Gemini."
version = "1.0.0"
id = "artifacts/ai-examiner"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20886

[services.development]
run = "pnpm --filter @workspace/ai-examiner run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ai-examiner", "run", "build" ]
serve = "static"
publicDir = "artifacts/ai-examiner/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20886"
BASE_PATH = "/"
